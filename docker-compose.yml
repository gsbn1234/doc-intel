# 第 7 步：Docker 一键部署。四个服务：
#   redis    —— 会话元数据（独立容器，backend 通过 REDIS_HOST=redis 连）
#   mysql    —— 对话记忆 / 长期记忆持久化（LangGraph checkpoint + store）
#   backend  —— FastAPI(8000)：Agent-RAG 核心
#   frontend —— Streamlit(8501)：网页，BACKEND_URL=http://backend:8000 调后端
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data            # Redis 数据持久化
    healthcheck:                    # 后端等它健康了才启动，避免连不上
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 字符集必须在服务端钉死。langgraph 的 DSN 解析（parse_conn_string）只取
    # host/user/password/db/port/unix_socket，DSN 查询串里的 ?charset=utf8mb4
    # 会被静默丢弃 —— 指望 DSN 设字符集是无效的，只能在这里定。
    # 顺带：MySQL ≥ 9.6 在生成列里移除了 MD5，而 saver 的 checkpoint_ns_hash
    # 就用了 MD5，且官方没给迁移路径。所以这里锁 8.0，别随手升。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      # root 密码与应用账号密码必须分开，所以是两个变量。两者同源的话，
      # 应用凭据一泄露 root 也跟着泄露。故意不给默认值：没配就让 compose
      # 当场报错，而不是悄悄退化成一个更弱的配置。
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置：请在 .env 里给 root 一个与应用账号不同的密码}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-doc_intel}
      # 这两行不能省：后端在容器里是用 doc_app 连的（env_file 注入），
      # 只给 root 密码的话镜像不会建这个账号，后端会一直 Access denied。
      # 镜像的 entrypoint 会建 'doc_app'@'%' 并授权到 MYSQL_DATABASE，
      # 正好覆盖"容器 IP 不是 localhost"这件事（本机那套建的是 @'localhost'）。
      - MYSQL_USER=${MYSQL_USER:-doc_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置，请在 .env 里配置}
    volumes:
      - mysql_data:/var/lib/mysql
    # 刻意没有 ports: —— 不向宿主机暴露 3306。
    #   ① 后端在 compose 网络里用服务名 mysql 直连，本来就不需要走宿主机端口；
    #   ② 3306 一旦映射出去，Docker 的 -p 会绕过 ufw 直接对外可达，而这个库
    #      最薄弱的环节就是那一个密码。要进去调试用：
    #        docker compose exec mysql mysql -uroot -p
    #   ③ 本机开发走的是宿主机自己的 MySQL 8.0（localhost:3306），两条路互不干扰。
    healthcheck:
      # 用 $$ 转义，让 $MYSQL_ROOT_PASSWORD 在容器内展开，密码不落到 compose 文件里。
      # mysqladmin ping 只证明 mysqld 活着、不接受连接之外的检查，够用了。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s             # 首次启动要初始化数据目录再建库，给足时间

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env                  # secrets 运行期注入，不打进镜像
    environment:
      - REDIS_HOST=redis            # 覆盖 session_store.py 默认的 localhost
      - MYSQL_HOST=mysql            # 覆盖 db.py 默认的 localhost；服务名在容器网络里就是域名
      - HF_HOME=/hf_cache           # 模型缓存指向挂载的 D 盘
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HUB_OFFLINE=1            # 模型全走本地缓存，禁联网检查（容器内 HF 被墙 + hub client 已关会报错）
    volumes:
      - ./faiss_db:/app/faiss_db                     # 会话索引持久化（上传建好的库）
      - ./checkpoints.sqlite:/app/checkpoints.sqlite  # 对话记忆（SqliteSaver）
      - /mnt/d/AI_CACHE/huggingface:/hf_cache         # 复用 D 盘已下载的模型，不重复下载
    ports:
      - "8000:8000"
    healthcheck:
      # /api/health 会真去 ping Redis、查 MySQL、看索引目录、读 MCP 状态；
      # Redis 挂了它返 503，这里就跟着 unhealthy，编排系统能把流量摘走。
      # 为什么用 python 而不是 curl：backend 镜像里没装 curl，python 一定有。
      # urlopen 遇到非 2xx 会抛异常，所以"没抛"就等于 200，不用再判一次状态码。
      test: ["CMD", "python", "-c", "import sys,urllib.request\ntry: urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\nexcept Exception: sys.exit(1)\nsys.exit(0)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s               # 启动要加载模型，别没起来就判死
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy    # 等建库完成，否则首次启动会连续报连不上库

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000   # compose 服务名在容器网络里就是域名
      # 后端开了鉴权时，前端得拿同一个 Key 才能调通。
      # 后端那边的同名变量由 env_file: .env 注入，这里单独给前端补一份。
      # ${VAR:-} 的默认空值：没配就传空串，前后端行为一致（都不校验收发）。
      - BACKEND_API_KEY=${BACKEND_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  redis_data:
  mysql_data:
